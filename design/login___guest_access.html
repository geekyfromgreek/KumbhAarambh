<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Background overlay for opacity -->
<div class="absolute inset-0 bg-diya-pattern opacity-20 pointer-events-none z-0"></div>
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12 relative z-10 w-full max-w-md mx-auto">
<!-- Header Section -->
<div class="text-center mb-stack-lg w-full">
<div class="flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight">KumbhAarambh</h1>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome to your sacred journey companion.</p>
</div>
<!-- Marigold Divider -->
<div aria-hidden="true" class="w-full marigold-divider mb-stack-lg opacity-80"></div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-[0_12px_24px_rgba(122,24,24,0.05)] border border-outline-variant/10 p-6 md:p-8 relative overflow-hidden backdrop-blur-sm bg-white/80">
<form class="flex flex-col gap-stack-lg">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-secondary" for="email">Phone Number or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-md focus:ring-2 focus:ring-secondary focus:border-secondary transition-all font-body-lg text-body-lg text-on-surface" id="email" placeholder="Enter your details" type="text"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-secondary" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-md focus:ring-2 focus:ring-secondary focus:border-secondary transition-all font-body-lg text-body-lg text-on-surface" id="password" placeholder="Enter your password" type="password"/>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-title-lg text-title-lg rounded-xl py-3 shadow-sm active:scale-95 transition-all flex justify-center items-center gap-2" type="button">
<span>Login</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full bg-transparent border border-outline text-primary hover:bg-surface-variant font-title-lg text-title-lg rounded-xl py-3 active:scale-95 transition-all flex justify-center items-center gap-2" type="button">
<span>Continue as Guest</span>
</button>
</div>
</form>
</div>
<!-- Nashikkar Info -->
<div class="mt-stack-lg w-full bg-surface-container-low rounded-xl p-4 border border-outline-variant/20 shadow-sm">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-tertiary mt-1" style="font-variation-settings: 'FILL' 1;">info</span>
<div>
<h3 class="font-title-lg text-title-lg text-tertiary mb-1">Nashikkars</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Log in to report fares, add local food spots, and share essential tips to help visiting Yatris.</p>
</div>
</div>
</div>
<!-- Sanskrit Quote -->
<div class="mt-12 text-center">
<p class="font-body-lg text-body-lg text-secondary italic opacity-80" style="font-family: 'Times New Roman', serif;">सत्यं शिवं सुन्दरम्</p>
</div>
