<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>KumbhAarambh - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#5c4300",
                        "surface-container-highest": "#e8e2d8",
                        "secondary-fixed": "#ffdad6",
                        "primary-fixed": "#ffdbce",
                        "inverse-on-surface": "#f7f0e6",
                        "on-secondary-container": "#731214",
                        "on-surface-variant": "#5a4138",
                        "on-primary-container": "#fffbff",
                        "tertiary": "#765700",
                        "surface-container-low": "#faf3e9",
                        "on-secondary-fixed-variant": "#86211f",
                        "on-tertiary-fixed": "#261a00",
                        "on-primary-fixed": "#370e00",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "surface": "#fff8f0",
                        "surface-container-high": "#eee7dd",
                        "background": "#fff8f0",
                        "on-primary": "#ffffff",
                        "on-background": "#1e1b16",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#f6be39",
                        "outline-variant": "#e2bfb2",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#410003",
                        "secondary": "#a63934",
                        "secondary-container": "#ff7b72",
                        "surface-bright": "#fff8f0",
                        "tertiary-container": "#956e00",
                        "on-primary-fixed-variant": "#802a00",
                        "primary-container": "#cc4800",
                        "primary-fixed-dim": "#ffb59a",
                        "on-surface": "#1e1b16",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb3ad",
                        "surface-dim": "#e0d9d0",
                        "inverse-primary": "#ffb59a",
                        "surface-tint": "#a73a00",
                        "primary": "#a33800",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdfa0",
                        "outline": "#8e7166",
                        "surface-container": "#f4ede3",
                        "inverse-surface": "#33302a",
                        "surface-variant": "#e8e2d8",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "12px",
                        "stack-lg": "24px",
                        "margin-mobile": "20px",
                        "base": "8px",
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "stack-sm": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-sm": ["Be Vietnam Pro"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "title-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],

                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }]

                }
            }
        }
    </script>
<style>
        .rangoli-bg {
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 0c0 11.046-8.954 20-20 20 11.046 0 20 8.954 20 20 0-11.046 8.954-20 20-20-11.046 0-20-8.954-20-20z" fill="%23cc4800" fill-opacity="0.05"/></svg>');
            background-size: 80px 80px;
        }
        .marigold-divider {
            position: relative;
            text-align: center;
        }
        .marigold-divider::before,
        .marigold-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(166, 57, 52, 0.2);
        }
        .marigold-divider::before { left: 0; }
        .marigold-divider::after { right: 0; }
        
        .ambient-shadow-primary {
            box-shadow: 0 12px 24px -8px rgba(163, 56, 0, 0.15);
        }
        .ambient-shadow-secondary {
            box-shadow: 0 12px 24px -8px rgba(166, 57, 52, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface min-h-screen flex flex-col items-center justify-center font-body-lg text-on-surface p-margin-mobile relative overflow-hidden rangoli-bg">
<!-- Decorative Corner Elements -->
<div class="absolute top-0 left-0 w-32 h-32 opacity-20 pointer-events-none">
<svg class="w-full h-full fill-primary" viewBox="0 0 100 100">
<path d="M0,0 L100,0 C100,55.23 55.23,100 0,100 L0,0 Z"></path>
</svg>
</div>
<div class="absolute bottom-0 right-0 w-32 h-32 opacity-20 pointer-events-none">
<svg class="w-full h-full fill-secondary" viewBox="0 0 100 100">
<path d="M100,100 L0,100 C0,44.77 44.77,0 100,0 L100,100 Z"></path>
</svg>
</div>
<!-- Main Container -->
<main class="w-full max-w-md mx-auto flex flex-col items-center z-10 space-y-stack-lg">
<!-- Header / Logo Area -->
<div class="text-center space-y-stack-sm flex flex-col items-center">
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mb-2 ambient-shadow-primary">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">KumbhAarambh</h1>
<h2 class="font-headline-md text-headline-md text-secondary">कुंभारंभ</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">आरंभ करो यात्रा। बिना डर के।</p>
</div>
<!-- Divider -->
<div class="w-full marigold-divider py-4">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">local_florist</span>
</div>
<!-- Role Selection Cards -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Yatri Card -->
<button class="group relative bg-surface-container-lowest rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-1 hover:border-primary ambient-shadow-primary border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed/20 to-transparent rounded-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center mb-4 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">hiking</span>
</div>
<h3 class="font-title-lg text-title-lg text-primary mb-2">I am a Yatri</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Navigate the Mela, find facilities, and stay safe.</p>
</button>
<!-- Nashikkar Card -->
<button class="group relative bg-surface-container-lowest rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 hover:-translate-y-1 hover:border-secondary ambient-shadow-secondary border border-outline-variant/30 focus:outline-none focus:ring-2 focus:ring-secondary">
<div class="absolute inset-0 bg-gradient-to-br from-secondary-fixed/20 to-transparent rounded-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center mb-4 text-secondary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<h3 class="font-title-lg text-title-lg text-secondary mb-2">I am a Nashikkar</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Access local routes, volunteer, and host Yatris.</p>
</button>
</div>
<!-- Bottom Section -->
<div class="w-full flex flex-col items-center mt-stack-lg space-y-stack-md">
<!-- Language Pills -->
<div class="flex flex-wrap justify-center gap-2">
<button class="px-4 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-container-highest transition-colors">हिंदी</button>
<button class="px-4 py-1.5 rounded-full font-label-md text-label-md bg-tertiary-container text-on-tertiary-container shadow-sm">English</button>
<button class="px-4 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:bg-surface-container-highest transition-colors">मराठी</button>
</div>
<!-- Quote -->
<div class="mt-8 text-center px-4">
<p class="font-body-sm text-body-sm text-outline italic">"सब तीर्थ बार बार, गंगासागर एक बार"</p>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for cards
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function() {
                this.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', function() {
                this.style.transform = '';
            });
            button.addEventListener('mouseleave', function() {
                this.style.transform = '';
            });
        });
    </script>
</body></html>
